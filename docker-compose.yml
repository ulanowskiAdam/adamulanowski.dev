services:
  web:
    image: ghcr.io/ulanowskiadam/adamulanowski.dev:latest
    container_name: adamulanowski-web
    expose:
      - "4000"
    environment:
      PORT: "4000"
    networks:
      - proxy
    restart: always

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy_default}

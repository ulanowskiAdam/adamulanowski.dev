services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/ulanowskiadam/adamulanowski.dev:latest}
    container_name: adamulanowski-web
    expose:
      - "4000"
    environment:
      PORT: "4000"
      RESEND_API_KEY_FILE: /run/secrets/resend_api_key
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO:-aulanowski98@gmail.com}
    secrets:
      - resend_api_key
    networks:
      - proxy
    restart: always
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get('http://127.0.0.1:4000/', { headers: { Host: 'localhost' }, timeout: 4000 }, r => { r.resume(); process.exit(r.statusCode === 200 ? 0 : 1); }).on('timeout', function () { this.destroy(); }).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy_default}

secrets:
  resend_api_key:
    file: ./secrets/resend_api_key

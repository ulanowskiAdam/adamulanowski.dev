name: Build and deploy

on:
  push:
    branches:
      - main
      - feature/sformatuj-swoj-biznes-configurator

permissions:
  contents: read

# Both branches publish the same latest tag and deploy to the same VPS.
concurrency:
  group: adamulanowski-dev-production
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ulanowskiadam
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/ulanowskiadam/adamulanowski.dev:latest
            ghcr.io/ulanowskiadam/adamulanowski.dev:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_PAT
          script: |
            set -eu
            cd "$HOME/projects/adamulanowski.dev"
            printf '%s' "$GHCR_PAT" | docker login ghcr.io --username ulanowskiadam --password-stdin
            docker compose pull
            docker compose down --remove-orphans
            docker compose up -d
            docker image prune -f
